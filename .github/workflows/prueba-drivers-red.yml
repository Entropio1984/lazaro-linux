# EXPERIMENTO (rama prueba-drivers-red, no fusionar): revisa qué
# controladores de red trae el kernel de Alpine, qué firmware piden y si
# los controladores de fuera del kernel se pueden compilar.
name: Prueba drivers de red

on:
  push:
    branches: [prueba-drivers-red]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auditoria:
    runs-on: ubuntu-24.04
    container: alpine:3.24
    steps:
      - name: Instalar kernel y todo el firmware
        run: |
          apk add -q linux-lts linux-firmware kmod zd1211-firmware bluez-firmware b43-fwcutter >/dev/null
          ls /lib/modules
          apk list -I 'linux-lts' 'linux-firmware' 2>/dev/null
      - name: Configuración del kernel (gzip+base64)
        run: |
          ls /boot; cp /boot/config* /tmp/config-lts 2>/dev/null || zcat /proc/config.gz > /tmp/config-lts || find / -name "config-6*" -not -path "/proc/*" 2>/dev/null; grep -c . /tmp/config-lts
      - name: Módulos de red y el firmware que piden
        run: |
          K=$(ls /lib/modules | head -1)
          cd /lib/modules/$K/kernel
          out=/tmp/fw.tsv; : > $out
          find drivers/net drivers/bluetooth drivers/staging drivers/usb/atm drivers/atm drivers/usb/net drivers/ssb drivers/bcma drivers/nfc net -name '*.ko*' 2>/dev/null | sort > /tmp/mods.txt
          wc -l < /tmp/mods.txt
          while read -r m; do
            fws=$(modinfo -F firmware "$m" 2>/dev/null)
            [ -n "$fws" ] || { printf '%s\t-\t-\n' "$m" >> $out; continue; }
            for f in $fws; do
              hit=""
              for c in "" .zst .xz .gz; do
                [ -e "/lib/firmware/$f$c" ] && { hit="/lib/firmware/$f$c"; break; }
              done
              if [ -z "$hit" ]; then
                g=$(ls /lib/firmware/$f* 2>/dev/null | head -1)   # comodines (*.bin)
                [ -n "$g" ] && hit="$g"
              fi
              if [ -n "$hit" ]; then
                r=$(readlink -f "$hit")
                o=$(apk info -q --who-owns "$r" 2>/dev/null | head -1)
                printf '%s\t%s\t%s\n' "$m" "$f" "${o:-SIN-DUENO}" >> $out
              else
                printf '%s\t%s\tFALTA\n' "$m" "$f" >> $out
              fi
            done
          done < /tmp/mods.txt
          echo "Firmware que falta en todo linux-firmware:"
          awk -F'\t' '$3=="FALTA"' $out
          mkdir -p /tmp/res
          (cd /lib/firmware && find . -type f -o -type l | sed 's#^\./##' | sort) > /tmp/res/fwfiles.txt
          for p in $(apk info -q | grep '^linux-firmware-'); do apk info -qL $p | sed "s#^#$p\t#"; done > /tmp/res/fw-paquetes.tsv
          cp $out /tmp/mods.txt /tmp/res/ && cp /tmp/config-lts /tmp/res/config-lts
          for m in $(cat /tmp/mods.txt); do printf '%s\t%s\n' "$m" "$(modinfo -F description $m | head -1)"; done > /tmp/res/descripciones.tsv
          apk info -s $(apk search -q 'linux-firmware*') 2>/dev/null | paste - - - | awk '{print $1"\t"$(NF-1)$NF}' > /tmp/res/firmware-tamanos.tsv || true
      - name: Tamaño de los paquetes de firmware extra
        run: apk info -s zd1211-firmware bluez-firmware b43-fwcutter linux-lts linux-lts-dev 2>/dev/null | tee /tmp/res/extras.txt || true
      - name: Guardar resultados en la rama
        run: |
          apk add -q git >/dev/null
          git config --global --add safe.directory '*'
          git clone -q --depth 1 -b ${{ github.ref_name }} https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} /tmp/repo
          mkdir -p /tmp/repo/resultados && cp /tmp/res/* /tmp/repo/resultados/
          cd /tmp/repo && git add resultados && git -c user.name=ci -c user.email=ci@localhost commit -qm "Resultados de la auditoría [skip ci]" && git push -q

  fuera-del-kernel:
    # Controladores que no vienen en el kernel: los de Alpine "testing"
    # (solo edge) y broadcom-wl (privativo, tomado de Arch). ¿Compilan
    # con el kernel de la estable?
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.24
      options: --privileged
    steps:
      - name: Preparar compilación
        run: |
          apk add -q linux-lts linux-lts-dev akms build-base curl zstd tar >/dev/null
          echo "@testing https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
          apk update -q
          ls /lib/modules
      - name: Paquetes -src de testing (compilación directa, bwrap no anda en el contenedor)
        run: |
          K=$(ls /lib/modules | head -1)
          for p in rtl8821ce-src rtl8812au-src rtl88x2bu-src rtl8192eu-src rtw89-src; do
            apk add -q "$p@testing" >/dev/null 2>&1 || true
          done
          for d in /usr/src/*; do
            case $d in *linux-headers*) continue;; esac
            echo "::group::$d"
            rc=0; ( cd $d && make -j4 -C /lib/modules/$K/build M=$d modules ) > /tmp/log 2>&1 || rc=$?
            grep -E 'error|Error' /tmp/log | head -8; tail -n 3 /tmp/log
            echo "::endgroup::"
            echo "RESULTADO $d rc=$rc ko: $(find $d -name '*.ko' | xargs -r ls -la | awk '{print $5, $9}' | tr '\n' ' ')"
          done
      - name: broadcom-wl (privativo) desde Arch
        run: |
          K=$(ls /lib/modules | head -1)
          base=https://geo.mirror.pkgbuild.com/extra/os/x86_64
          f=$(curl -fsSL $base/ | grep -o 'broadcom-wl-dkms-[^"]*\.pkg\.tar\.zst' | grep -v sig | sort -u | tail -1)
          echo "Paquete: $f"
          mkdir -p /tmp/wl && cd /tmp/wl
          curl -fsSL "$base/$f" | zstd -d | tar x
          cp -a usr/lib/broadcom-wl-dkms /usr/lib/ 2>/dev/null; ls -la /usr/lib/broadcom-wl-dkms || true
          src=$(ls -d usr/src/broadcom-wl-* | head -1)
          echo "Fuente: $src"; ls -la "$src" "$src/lib" 2>/dev/null | head -20
          cat "$src/dkms.conf" 2>/dev/null | head -30
          rc=0; make -C /lib/modules/$K/build M=/tmp/wl/$src 2>&1 | tail -n 30 || rc=$?
          ls -la /tmp/wl/$src/*.ko 2>/dev/null && modinfo /tmp/wl/$src/wl.ko | grep -vE '^(alias|srcversion|sig)' | head -15
          modinfo -F alias /tmp/wl/$src/wl.ko 2>/dev/null | sort -u | tr '\n' ' '; echo
          echo "RESULTADO broadcom-wl rc=$rc"
