# EXPERIMENTO (rama prueba-hardware, no fusionar): versiones del paquete
# firmware-ipw2x00 en Debian y sus sumas.
name: Prueba hardware

on:
  push:
    branches: [prueba-hardware]
  workflow_dispatch:

jobs:
  ipw:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          pool=https://deb.debian.org/debian/pool/non-free-firmware/f/firmware-nonfree
          for d in $(curl -fsSL "$pool/" | grep -o 'firmware-ipw2x00_[^"]*_all\.deb' | sort -u); do
            curl -fsSL -o /tmp/p.deb "$pool/$d"
            echo "DEB $d $(stat -c %s /tmp/p.deb) $(sha256sum /tmp/p.deb | cut -c1-64)"
            (cd /tmp && rm -rf x && mkdir x && cd x && ar x ../p.deb && tar -tf data.tar.* | grep -E 'fw$|copyright' | tr '\n' ' '; echo)
          done
          for s in bookworm trixie forky; do
            echo "SUITE $s: $(curl -fsSL https://deb.debian.org/debian/dists/$s/non-free-firmware/binary-all/Packages.xz | xz -d | grep -A12 '^Package: firmware-ipw2x00$' | grep -E '^(Version|Filename|SHA256):' | tr '\n' ' ')"
          done
