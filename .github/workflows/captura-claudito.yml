# TEMPORAL (se borra antes de fusionar): capturas de Sway con Claudito
# Shell Fusion para el README y el manual. Las sube a esta misma rama.
name: Captura de Claudito
on:
  push:
    branches: [claude/project-thread-jyefqi]
    paths:
      - pruebas/captura-claudito.sh
      - .github/workflows/captura-claudito.yml
permissions:
  contents: read
jobs:
  captura:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/out:/out" alpine:3.24 sh /src/pruebas/captura-claudito.sh
      - name: Subir las capturas a la rama
        run: |
          sudo apt-get install -y -q optipng >/dev/null
          ls -l out
          for f in out/*.png; do
            sudo optipng -quiet -o2 "$f"
            n=$(basename "$f")
            cp "$f" "manual/imagenes/capturas/$n"
          done
          cp out/sway-claudito.png docs/imagenes/sway-claudito.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual/imagenes/capturas docs/imagenes
          git commit -m "Capturas de Sway con Claudito Shell Fusion"
          git push
