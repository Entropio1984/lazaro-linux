# Experimento (no fusionar): diagnóstico de mpv en Alpine 3.24 con la
# configuración de YouTube ligero.
name: Prueba YouTube ligero
on:
  push:
    branches: [prueba-youtube]
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.24
      options: --cpus 1 --memory 2g --memory-swap 2g
    steps:
      - uses: actions/checkout@v5
      - name: Diagnóstico
        shell: sh
        run: sh pruebas/youtube/diagnostico.sh
