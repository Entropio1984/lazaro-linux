# EXPERIMENTO (rama prueba-claude, no fusionar): ¿corre Claude en Alpine?
name: Prueba Claude en Alpine
on:
  push:
    branches: [prueba-claude]
    paths: [.github/workflows/prueba-claude.yml]
  workflow_dispatch:
jobs:
  claude-desktop:
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: Intentar la app de escritorio (.deb, glibc) con gcompat
        run: |
          set -x
          apk add --no-cache wget gcompat libc6-compat binutils xz zstd tar file gtk+3.0 nss alsa-lib libxkbcommon mesa-gbm libxshmfence cups-libs at-spi2-core libdrm xvfb-run xvfb dbus libsecret libnotify
          wget -qO- https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages | tee /tmp/Packages | grep -E "^(Version|Filename|Depends|Installed-Size)" | head -8
          f=$(grep -m1 '^Filename:' /tmp/Packages | awk '{print $2}')
          wget -qO /tmp/cd.deb "https://downloads.claude.ai/claude-desktop/apt/stable/$f"
          mkdir /tmp/cd && cd /tmp/cd && ar x /tmp/cd.deb && ls && tar xf data.tar.* && find . -maxdepth 4 -type f -perm -u+x | head
          bin=$(find . -type f -name 'claude-desktop' -perm -u+x | head -1); [ -n "$bin" ] || bin=$(find . -type f -name 'claude' -perm -u+x | head -1)
          file "$bin"
          ldd "$bin" 2>&1 | grep -iE "not found|symbol" | head -20 || true
          timeout 60 xvfb-run -a "$bin" --no-sandbox --disable-gpu > /tmp/out.txt 2>&1; echo "rc=$?"
          head -40 /tmp/out.txt
