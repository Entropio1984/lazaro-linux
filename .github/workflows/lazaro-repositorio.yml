# Repositorio de paquetes de Lázaro: arma y publica, firmados con la clave
# de Lázaro, el paquete lazaro-herramientas (afinador, controladores,
# diagnóstico, kernel, repositorio) y el kernel Lázaro (linux-lazaro), en
# la Release "repo-<versión de Alpine>" (APKINDEX.tar.gz para 64 bits y
# APKINDEX-x86.tar.gz, solo con las herramientas, para 32). Los equipos lo copian con
# lazaro-repositorio (tarea diaria) y lo instalan con la actualización
# normal del sistema.
#
# Las mejoras llegan a los equipos instalados SOLO con las versiones
# numeradas (decisión de Julián, 2026-11-16):
# - Cada cambio de main (y cada PR) arma y prueba las herramientas, y el
#   kernel si cambió su receta, pero NO publica nada.
# - Al sacar una versión ("Sacar una versión"), "Lázaro Linux ISO" la
#   publica y al final lanza este flujo sobre la etiqueta vX.Y: ahí se
#   publican las herramientas (y el kernel, si su receta cambió).
# - La revisión diaria solo mira si Alpine sacó un linux-lts nuevo
#   (arreglos de seguridad del kernel) y, si es así, rehace el kernel
#   Lázaro con la receta (kernel/) de la última versión publicada. No es
#   una mejora de Lázaro sino de Alpine, que también llega a diario a los
#   equipos con el kernel normal.
# Para volver a publicar una versión a mano: Actions → "Repositorio
# Lázaro" → Run workflow, eligiendo la etiqueta (por ejemplo v0.2) en
# lugar de main.
name: Repositorio Lázaro

on:
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "repo/**"
      - "paquetes/lazaro-herramientas/**"
      - "live/usr/sbin/**"
      - "live/usr/share/lazaro/**"
      - "live/usr/share/applications/**"
      - "live/etc/xdg/autostart/**"
      - "pruebas/kernel-arranque.sh"
      - ".github/workflows/lazaro-repositorio.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "repo/**"
      - "paquetes/lazaro-herramientas/**"
      - "live/usr/sbin/**"
      - "live/usr/share/lazaro/**"
      - "live/usr/share/applications/**"
      - "live/etc/xdg/autostart/**"
      - "pruebas/kernel-arranque.sh"
      - ".github/workflows/lazaro-repositorio.yml"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Compilar el kernel aunque ya esté publicada esta versión"
        type: boolean
        default: false

# Solo lectura salvo en publicar.
permissions:
  contents: read

concurrency:
  group: lazaro-repositorio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    name: ¿Qué hay que armar?
    runs-on: ubuntu-24.04
    outputs:
      kernel: ${{ steps.r.outputs.kernel }}
      version: ${{ steps.r.outputs.version }}
      etiqueta: ${{ steps.r.outputs.etiqueta }}
      fuente: ${{ steps.r.outputs.fuente }}
      herramientas: ${{ steps.r.outputs.herramientas }}
      publicar: ${{ steps.r.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          FORZAR: ${{ inputs.forzar }}
          ANTES: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          LAZARO_DIR=$PWD . ./lib.sh
          # De dónde sale lo que se arma y si se publica:
          #   etiqueta vX.Y  -> esa versión, se publica todo (herramientas
          #                     y kernel si hace falta)
          #   diaria / a mano en main -> solo el kernel, con la receta de
          #                     la última versión publicada
          #   main, PR, otra rama -> se arma y se prueba, no se publica
          fuente="$GITHUB_SHA"
          herramientas=si
          publicar=no
          case "$GITHUB_REF" in
            refs/tags/v*)
              [ "$EVENTO" = workflow_dispatch ] || { echo "::error::Una versión se publica lanzando el flujo sobre la etiqueta."; exit 1; }
              # Solo una etiqueta que está en main (protegida).
              estado="$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)"
              case "$estado" in
                identical | behind) ;;
                *) echo "::error::La etiqueta $GITHUB_REF_NAME no está en main: no se publica."; exit 1 ;;
              esac
              publicar=si
              ;;
            refs/heads/main)
              if [ "$EVENTO" = schedule ] || [ "$EVENTO" = workflow_dispatch ]; then
                ultima="$(git tag -l 'v*' | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -n 1 || true)"
                [ -n "$ultima" ] || { echo "Todavía no hay ninguna versión publicada: nada que hacer."; ultima=""; }
                herramientas=no
                if [ -n "$ultima" ]; then
                  fuente="$ultima"
                  publicar=si
                  git checkout -q "$ultima" -- kernel
                fi
              fi
              ;;
          esac
          KERNEL_REV="$(sed -n 's/^KERNEL_REV=\([0-9][0-9]*\)$/\1/p' kernel/version)"
          [ -n "$KERNEL_REV" ] || { echo "kernel/version: falta KERNEL_REV=<número>"; exit 1; }
          apkbuild="$(curl -fsSL --retry 3 "https://raw.githubusercontent.com/alpinelinux/aports/$APORTS_BRANCH/main/linux-lts/APKBUILD")"
          pkgver="$(printf '%s\n' "$apkbuild" | sed -n 's/^pkgver=//p')"
          pkgrel="$(printf '%s\n' "$apkbuild" | sed -n 's/^pkgrel=//p')"
          version="$pkgver-r$((pkgrel * 100 + KERNEL_REV))"
          etiqueta="repo-$ALPINE_BRANCH"
          publicado=no
          gh release view "$etiqueta" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "linux-lazaro-$version.apk" && publicado=si
          case "$EVENTO" in
            schedule) kernel=$([ "$publicado" = si ] && echo no || echo si) ;;
            workflow_dispatch) kernel=$([ "$publicado" = si ] && [ "$FORZAR" != true ] && echo no || echo si) ;;
            push)
              # Un cambio de main ya no se publica, y la receta del kernel
              # ya se probó en su PR: no se gastan 2 horas en compilarlo.
              kernel=no
              ;;
            *)
              # PR: cambios en la receta del kernel (o la primera vez).
              kernel=no
              [ "$publicado" = si ] || kernel=si
              if [ -n "$ANTES" ] && git cat-file -e "$ANTES" 2>/dev/null; then
                git diff --name-only "$ANTES" HEAD | grep -qE '^(kernel/|pruebas/kernel-arranque\.sh$|repo/firma\.sh$)' && kernel=si
              else
                kernel=si
              fi
              ;;
          esac
          # Diaria en main sin ninguna versión todavía: nada.
          [ "$publicar" = si ] || [ "$herramientas" = si ] || kernel=no
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "etiqueta=$etiqueta" >> "$GITHUB_OUTPUT"
          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"
          echo "fuente=$fuente" >> "$GITHUB_OUTPUT"
          echo "herramientas=$herramientas" >> "$GITHUB_OUTPUT"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
          echo "linux-lazaro $version ($etiqueta): publicado=$publicado compilar=$kernel"
          echo "Desde: $fuente  herramientas=$herramientas  publicar=$publicar"

  kernel:
    name: Compilar y probar linux-lazaro ${{ needs.revisar.outputs.version }}
    needs: revisar
    if: needs.revisar.outputs.kernel == 'si' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # En la revisión diaria, la receta de la última versión publicada.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.revisar.outputs.fuente }}

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Compilar
        env:
          # La clave nunca llega a un PR: ahí se firma con una de prueba.
          LAZARO_APK_KEY: ${{ github.event_name != 'pull_request' && secrets.LAZARO_APK_KEY || '' }}
        run: ./kernel/compilar.sh

      - name: Probar el arranque en QEMU (y comparar con linux-lts)
        shell: bash
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 cpio >/dev/null
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          LAZARO_DIR=$PWD . ./lib.sh
          lts_ver="$(curl -fsSL "$ALPINE_REPO_MAIN/$ALPINE_ARCH/APKINDEX.tar.gz" | tar -xzO APKINDEX | awk '/^P:/ { p = ($0 == "P:linux-lts") } p && /^V:/ && v == "" { v = substr($0, 3) } END { print v }')"
          [ -n "$lts_ver" ] || { echo "No se encontró linux-lts en el índice de Alpine."; exit 1; }
          curl -fsSL --retry 3 -o /tmp/linux-lts.apk "$ALPINE_REPO_MAIN/$ALPINE_ARCH/linux-lts-$lts_ver.apk"
          # El paquete que salió de verdad (aports pudo avanzar desde la revisión).
          apk_lazaro="$(ls salida/kernel/x86_64/linux-lazaro-[0-9]*.apk)"
          sh pruebas/kernel-arranque.sh "$apk_lazaro" /tmp/linux-lts.apk | tee /tmp/arranque.txt
          grep -q '^Memoria libre al arrancar' /tmp/arranque.txt || { echo "Falta la comparación con linux-lts."; exit 1; }
          sudo sh -c 'cat /tmp/arranque.txt >> salida/kernel/resumen.txt'
          {
            echo "### Kernel Lázaro ${{ needs.revisar.outputs.version }}"
            echo '```'
            cat salida/kernel/resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # También si falla la prueba: compilar tarda horas y el paquete sirve
      # para ver qué pasó (nunca se publica sin la prueba).
      - uses: actions/upload-artifact@v6
        if: success() || failure()
        with:
          name: kernel-lazaro
          path: salida/kernel
          retention-days: 14

  herramientas:
    name: Armar lazaro-herramientas
    needs: revisar
    if: needs.revisar.outputs.herramientas == 'si' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Armar
        env:
          LAZARO_APK_KEY: ${{ github.event_name != 'pull_request' && secrets.LAZARO_APK_KEY || '' }}
        run: |
          # Cada cambio de lazaro-linux es una versión nueva del paquete.
          LAZARO_REL="$(git rev-list --count HEAD)" ./repo/herramientas.sh
          {
            echo "### lazaro-herramientas"
            echo '```'
            cat salida/herramientas/resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # El índice de 32 bits sale del mismo paquete (aquí solo se
      # comprueba que se arma; el que se publica lo firma "publicar").
      # Sin firmar: en un PR la clave de prueba cambia con cada contenedor
      # y el paquete no se podría verificar (y tocar repo/firma.sh haría
      # recompilar el kernel).
      - name: Probar el índice de 32 bits
        run: |
          mkdir -p /tmp/repo-x86
          cp salida/herramientas/x86_64/lazaro-herramientas-*.apk /tmp/repo-x86/
          docker run --rm -v /tmp/repo-x86:/r -w /r alpine:3.24 \
            sh -c 'apk index --quiet --allow-untrusted -o APKINDEX.tar.gz --rewrite-arch x86 ./*.apk'
          tar -xzOf /tmp/repo-x86/APKINDEX.tar.gz APKINDEX | grep -qx 'A:x86'
          tar -xzOf /tmp/repo-x86/APKINDEX.tar.gz APKINDEX | grep -qx 'P:lazaro-herramientas'
      - uses: actions/upload-artifact@v6
        with:
          name: lazaro-herramientas
          path: salida/herramientas
          retention-days: 14

  publicar:
    name: Publicar el repositorio
    needs: [revisar, kernel, herramientas]
    # Solo una versión (etiqueta vX.Y) o el kernel de la revisión diaria
    # (ver arriba). Un cambio de main ya no se publica.
    if: >-
      !cancelled() && needs.revisar.outputs.publicar == 'si' && github.event_name != 'pull_request' &&
      (needs.herramientas.result == 'success' || (needs.herramientas.result == 'skipped' && needs.revisar.outputs.herramientas == 'no')) &&
      (needs.kernel.result == 'success' || needs.kernel.result == 'skipped') &&
      (needs.herramientas.result == 'success' || needs.kernel.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: lazaro-repositorio-publicar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Cada paquete en su propia carpeta (nuevo/<nombre>/). Sin "name",
      # download-artifact deja un artefacto solo sin carpeta propia
      # (nuevo/resumen.txt): eso pasaba cada vez que no se compilaba el
      # kernel y el repositorio no se publicaba desde el 9 de noviembre.
      - uses: actions/download-artifact@v7
        if: needs.herramientas.result == 'success'
        with:
          name: lazaro-herramientas
          path: nuevo/lazaro-herramientas

      - uses: actions/download-artifact@v7
        if: needs.kernel.result == 'success'
        with:
          name: kernel-lazaro
          path: nuevo/kernel-lazaro

      - name: Juntar con lo publicado y firmar el índice
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ETIQUETA: ${{ needs.revisar.outputs.etiqueta }}
          LAZARO_APK_KEY: ${{ secrets.LAZARO_APK_KEY }}
        run: |
          # Solo se publica lo firmado con la clave oficial.
          for r in nuevo/*/resumen.txt; do
            grep -qx 'FIRMA=oficial' "$r" || { echo "Sin el secreto LAZARO_APK_KEY no se publica ($r)."; exit 1; }
          done
          mkdir -p repo-x86_64
          gh release download "$ETIQUETA" -p '*.apk' -D repo-x86_64 2>/dev/null || echo "Release nueva."
          # Un archivo ya publicado no se cambia (los equipos que lo tienen
          # no lo vuelven a bajar y su suma ya no coincidiría con el índice).
          cp -n nuevo/*/x86_64/*.apk repo-x86_64/
          ./repo/indexar.sh repo-x86_64 | tee indexar.txt
          grep -qx 'FIRMA=oficial' indexar.txt
          # 32 bits: un índice aparte (APKINDEX-x86.tar.gz) con las mismas
          # herramientas, que no dependen del procesador. El kernel Lázaro
          # es de 64 bits y no va.
          mkdir -p repo-x86
          cp repo-x86_64/lazaro-herramientas-*.apk repo-x86/
          ALPINE_ARCH=x86 ./repo/indexar.sh repo-x86 | tee indexar-x86.txt
          grep -qx 'FIRMA=oficial' indexar-x86.txt

      - name: Actualizar la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ETIQUETA: ${{ needs.revisar.outputs.etiqueta }}
          HERRAMIENTAS: ${{ needs.herramientas.result }}
        run: |
          # De qué versión de Lázaro son las herramientas publicadas.
          if [ "$HERRAMIENTAS" = success ]; then
            echo "$GITHUB_REF_NAME" > version-lazaro.txt
          else
            gh release download "$ETIQUETA" -p version-lazaro.txt 2>/dev/null || echo "?" > version-lazaro.txt
          fi
          notas="Repositorio de paquetes de Lázaro Linux con Alpine ${ETIQUETA#repo-}, firmado con la clave de Lázaro. No hace falta descargar nada a mano: los equipos lo usan solos (lazaro-repositorio).

          Herramientas de Lázaro $(cat version-lazaro.txt): las mejoras llegan a los equipos instalados solo al publicar una versión.

          Para activarlo en un equipo instalado antes de que existiera, una sola vez en la Terminal:

              wget -qO /tmp/lr https://github.com/$GH_REPO/releases/download/$ETIQUETA/lazaro-repositorio && doas sh /tmp/lr --activar

          Paquetes:
          $(cd repo-x86_64 && ls ./*.apk | sed 's|^\./|- |')

          $(cat nuevo/kernel-lazaro/resumen.txt 2>/dev/null || true)"
          if gh release view "$ETIQUETA" >/dev/null 2>&1; then
            gh release edit "$ETIQUETA" --notes "$notas"
          else
            gh release create "$ETIQUETA" --target "$GITHUB_SHA" --latest=false \
              --title "Repositorio Lázaro (Alpine ${ETIQUETA#repo-})" --notes "$notas"
          fi
          publicados="$(gh release view "$ETIQUETA" --json assets -q '.assets[].name')"
          # Primero los paquetes y al final el índice, para que un equipo
          # que descarga a la mitad nunca vea un índice sin sus paquetes.
          for a in repo-x86_64/*.apk; do
            printf '%s\n' "$publicados" | grep -qx "${a##*/}" || gh release upload "$ETIQUETA" "$a"
          done
          # El programa suelto (para activar equipos viejos) es el de la
          # versión: en la revisión diaria no se toca.
          if [ "$HERRAMIENTAS" = success ]; then
            cp live/usr/sbin/lazaro-repositorio lazaro-repositorio
            gh release upload "$ETIQUETA" lazaro-repositorio repo/lazaro.rsa.pub version-lazaro.txt --clobber
          fi
          gh release upload "$ETIQUETA" repo-x86_64/APKINDEX.tar.gz --clobber
          cp repo-x86/APKINDEX.tar.gz APKINDEX-x86.tar.gz
          gh release upload "$ETIQUETA" APKINDEX-x86.tar.gz --clobber
          # Las versiones anteriores ya no las nombra el índice.
          quedan="$(cd repo-x86_64 && ls ./*.apk | sed 's|^\./||')"
          printf '%s\n' "$publicados" | grep '\.apk$' | while read -r a; do
            printf '%s\n' "$quedan" | grep -qx "$a" || gh release delete-asset "$ETIQUETA" "$a" -y
          done
