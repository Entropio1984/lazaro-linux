# Compila la ISO de Lázaro Linux y la prueba en QEMU (BIOS y UEFI).
# Corre con la versión estable de Alpine de config.env. Los lunes (cron) y
# al lanzarla a mano, también con edge, para enterarse a tiempo de lo que
# rompería la siguiente versión. El cron semanal también recoge los
# cambios de desktop-postinstall.sh.
#
# Versiones numeradas: una etiqueta vX.Y (la crea el flujo "Sacar una
# versión", lazaro-version.yml) compila, prueba y publica una versión fija
# en su propia Release de GitHub y en la carpeta Versiones/X.Y de
# SourceForge. La versión es ISO_VERSION de config.env.
name: Lázaro Linux ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Cada lunes: detecta cambios de Alpine aunque nadie toque el repo.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: lazaro-iso-${{ github.ref }}
  cancel-in-progress: true

env:
  # Canal que queda en el sello de compilación de la ISO (version.env).
  LAZARO_CANAL: ${{ startsWith(github.ref, 'refs/tags/v') && 'versión' || (github.event_name == 'pull_request' && 'prueba' || 'en-desarrollo') }}
  # Proyecto de SourceForge donde se publican las dos ediciones
  # (sourceforge.net/projects/lazaro-linux, carpetas Ligera y Completa).
  SF_USUARIO: entropio
  SF_PROYECTO: lazaro-linux

jobs:
  # Manual de Lázaro (manual/, LaTeX): se compila primero porque el PDF va
  # dentro de las dos ediciones de la ISO. Si no compila, no hay ISO.
  manual:
    name: Manual (PDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Instalar LaTeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends latexmk \
            texlive-latex-extra texlive-lang-spanish texlive-fonts-recommended \
            tex-gyre lmodern texlive-bibtex-extra biber ghostscript

      - name: Compilar el manual
        run: |
          ./manual/compilar.sh
          b=$(stat -c %s manual/lazaro-manual.pdf)
          echo "Manual: $((b / 1024)) KB, $(pdfinfo manual/lazaro-manual.pdf 2>/dev/null | sed -n 's/^Pages: *//p') páginas"
          # La Ligera está cerca del límite de 2 GB: el manual no debe
          # pesar más de 25 MB (comprimir las capturas si pasa).
          if [ "$b" -gt 26214400 ]; then
            echo "::error::El manual pesa más de 25 MB: comprime las imágenes de manual/imagenes."
            exit 1
          fi

      # Las páginas citadas en la bibliografía todavía existen. Solo avisa:
      # algunos sitios rechazan a los robots aunque la página esté bien.
      - name: Revisar los enlaces de la bibliografía
        continue-on-error: true
        run: |
          rotos=0
          for u in $(grep -o 'url *= {[^}]*}' manual/referencias.bib | sed 's/url *= {//; s/}$//'); do
            c=$(curl -s -o /dev/null -L -m 30 -A "Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0" -w '%{http_code}' "$u" || true)
            case "$c" in
              2??) echo "ok   $u" ;;
              *) echo "::warning::Enlace del manual con respuesta $c: $u"; rotos=$((rotos + 1)) ;;
            esac
          done
          echo "Enlaces con problemas: $rotos"

      - uses: actions/upload-artifact@v6
        with:
          name: manual
          path: manual/lazaro-manual.pdf
          retention-days: 30

  iso:
    # Los PR que vienen de forks no compilan: la caché guarda la llave que
    # firma Calamares y el índice de la ISO, y un fork podría leerla.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ISO (${{ matrix.alpine }})
    needs: manual
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    continue-on-error: ${{ matrix.alpine == 'edge' }}
    strategy:
      fail-fast: false
      matrix:
        # "estable" = la de config.env. Edge (la próxima versión de
        # Alpine) solo en la compilación de los lunes y al lanzarla a mano:
        # avisa con tiempo qué se romperá al cambiar de versión, sin
        # demorar ni ensuciar cada PR (decisión de Julián, 2026-11-03).
        alpine: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))) && '["estable", "edge"]' || '["estable"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: manual
          path: manual

      - name: Versión de Alpine
        id: version
        run: |
          . config.env
          # Una versión numerada debe coincidir con config.env.
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ] && [ "$GITHUB_REF_NAME" != "v$ISO_VERSION" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con ISO_VERSION=$ISO_VERSION de config.env."
            exit 1
          fi
          if [ "${{ matrix.alpine }}" = edge ]; then
            echo "branch=edge" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$ALPINE_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Caché de Calamares compilado
        uses: actions/cache@v5
        with:
          path: cache
          key: calamares-${{ steps.version.outputs.branch }}-${{ hashFiles('paquetes/**', 'config.env', 'build.sh') }}

      - name: Compilar la ISO
        env:
          ALPINE_BRANCH: ${{ steps.version.outputs.branch }}
        run: ./build.sh

      # La descarga oficial es un archivo de una versión (Release) de
      # GitHub, que no acepta archivos de 2 GB o más.
      - name: Tamaño de la ISO (límite de GitHub, 2 GB)
        run: |
          for f in salida/*.iso; do
            b=$(stat -c %s "$f")
            echo "$f: $((b / 1048576)) MB"
            if [ "$b" -ge 2147483648 ]; then
              echo "::error::La ISO pesa 2 GB o más y GitHub no la aceptaría en la descarga."
              exit 1
            fi
          done

      - name: Permisos de la caché
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" cache salida || true

      - uses: actions/upload-artifact@v6
        with:
          name: iso-${{ matrix.alpine }}
          path: salida/*.iso*
          retention-days: 7
          compression-level: 0

  # Edición Completa (unos 4,5 GB, solo en SourceForge): los 7
  # escritorios, todo el firmware y OnlyOffice y Brave de Flathub, para
  # instalar sin internet. Va en trabajos aparte: si falla, la edición
  # Ligera se prueba y se publica igual. Solo con la versión estable de
  # Alpine (edge ya se revisa con la Ligera).
  iso-completa:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ISO Completa (estable)
    needs: manual
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: manual
          path: manual

      # La Completa necesita unos 15 GB libres; el equipo de GitHub trae
      # herramientas que aquí no se usan.
      - name: Liberar espacio en disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Versión de Alpine
        id: version
        run: |
          . config.env
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ] && [ "$GITHUB_REF_NAME" != "v$ISO_VERSION" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con ISO_VERSION=$ISO_VERSION de config.env."
            exit 1
          fi
          echo "branch=$ALPINE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Caché de Calamares compilado
        uses: actions/cache@v5
        with:
          path: cache
          key: calamares-${{ steps.version.outputs.branch }}-${{ hashFiles('paquetes/**', 'config.env', 'build.sh') }}

      # Repositorio de Flatpak local con OnlyOffice, Brave y su runtime,
      # copiados tal cual de Flathub (mismas versiones y commits). En la
      # ISO va en flatpak/ y lazaro-instalar instala desde ahí. Sin las
      # traducciones (.Locale), que Flatpak guarda solo en parte.
      - name: Aplicaciones de Flathub para el USB
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak ostree
          fp="$RUNNER_TEMP/flatpak"
          mkdir -p "$fp/disparadores"
          # Sin disparadores (actualizan cachés de iconos con bubblewrap):
          # aquí no hacen falta, se rehacen en el sistema instalado.
          export FLATPAK_USER_DIR="$fp/usuario" FLATPAK_TRIGGERSDIR="$fp/disparadores"
          apps="org.onlyoffice.desktopeditors com.brave.Browser"
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub $apps
          flatpak --user list
          usb="$GITHUB_WORKSPACE/flatpak-usb"
          rm -rf "$usb"
          mkdir -p "$usb"
          ostree init --repo="$usb/repo" --mode=archive
          origen="$FLATPAK_USER_DIR/repo"
          for ref in $(ostree refs --repo="$origen" | grep -E '^flathub:(app|runtime)/' | grep -vE '\.(Locale|Debug|Sources)/'); do
            commit=$(ostree rev-parse --repo="$origen" "$ref")
            echo "${ref#flathub:} $commit"
            ostree pull-local --repo="$usb/repo" "$origen" "$commit"
            ostree refs --repo="$usb/repo" --create="${ref#flathub:}" "$commit"
          done
          flatpak build-update-repo "$usb/repo"
          curl -fsSL --retry 3 -o "$usb/flathub.flatpakrepo" https://dl.flathub.org/repo/flathub.flatpakrepo
          printf '%s\n' $apps > "$usb/aplicaciones"
          rm -rf "$fp"
          chmod -R a+rX "$usb"
          du -sh "$usb"
          df -h /

      - name: Compilar la ISO Completa
        env:
          ALPINE_BRANCH: ${{ steps.version.outputs.branch }}
          LAZARO_EDICION: completa
          LAZARO_FLATPAK_USB: ${{ github.workspace }}/flatpak-usb
        run: ./build.sh

      - name: Tamaño de la ISO
        run: |
          for f in salida/*.iso; do
            echo "$f: $(($(stat -c %s "$f") / 1048576)) MB"
          done
          df -h /

      - name: Permisos de la caché
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" cache salida || true

      - uses: actions/upload-artifact@v6
        with:
          name: iso-completa
          path: salida/*.iso*
          retention-days: 7
          compression-level: 0

  pruebas-completa:
    name: Prueba Completa ${{ matrix.prueba }}
    needs: iso-completa
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        prueba:
          - live bios
          - live uefi
          # Sin red: todo sale del USB, incluidos OnlyOffice y Brave.
          - instalar uefi plasma sin-red
          - instalar bios gnome sin-red
          # Wifi Broadcom simulada: broadcom-wl se compila sin internet.
          - instalar bios xfce sin-red broadcom
          - instalar uefi lxqt con-red
    steps:
      - uses: actions/checkout@v5

      - name: Liberar espacio en disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf xorriso socat imagemagick

      - uses: actions/download-artifact@v7
        with:
          name: iso-completa
          path: iso

      - name: Probar
        run: |
          set -- ${{ matrix.prueba }}
          orden="$1"; shift
          ./pruebas/qemu.sh "$orden" iso/*.iso "$@"

      - name: Nombre de los resultados
        if: always()
        id: nombre
        run: echo "valor=$(echo 'completa-${{ matrix.prueba }}' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: resultados-${{ steps.nombre.outputs.valor }}
          path: |
            pruebas/resultados/*.log
            pruebas/resultados/*.png
            pruebas/resultados/*.ppm
          retention-days: 14

  # Decisiones de la revisión de tarjetas gráficas de la live y de
  # lazaro-controladores con un /sys simulado: las máquinas virtuales no
  # tienen NVIDIA, impresoras ni wifi viejo.
  graficas:
    name: Revisión de gráficas (simulada)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sh pruebas/graficas.sh
      - run: sh pruebas/recomendacion.sh
      # lazaro-controladores, también con el busybox de Alpine (su awk,
      # tar y dd son los que usa la ISO).
      - run: sh pruebas/controladores.sh
      - run: docker run --rm -v "$PWD:/src:ro" -w /src alpine:3.24 sh pruebas/controladores.sh
      # lazaro-afinador: qué ajustes elige en equipos viejos y nuevos, y que
      # aplicar y deshacer dejen GRUB y sysctl.d como estaban.
      - run: sh pruebas/afinador.sh
      - run: docker run --rm -v "$PWD:/src:ro" -w /src alpine:3.24 sh pruebas/afinador.sh
      # lazaro-kernel: instalar, arranque de prueba bien y mal, actualizar
      # y quitar, con GRUB y apk falsos.
      - run: sh pruebas/kernel.sh
      - run: docker run --rm -v "$PWD:/src:ro" -w /src alpine:3.24 sh -c 'apk add -q curl && sh pruebas/kernel.sh'

  pruebas:
    name: Prueba ${{ matrix.prueba }} (${{ matrix.alpine }})
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: ${{ matrix.alpine == 'edge' }}
    strategy:
      fail-fast: false
      matrix:
        alpine: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))) && '["estable", "edge"]' || '["estable"]') }}
        prueba:
          - live bios
          - live uefi
          # Equipo viejo con 2 GB de RAM: la sesión live vive en la memoria.
          - live bios 2048
          # Sin escritorio (Xorg no arranca): aviso del instalador en modo texto.
          - texto bios
          - instalar bios xfce sin-red
          - instalar uefi xfce con-red
          - instalar uefi plasma con-red
          - instalar bios gnome con-red
          - instalar bios sway con-red
          - instalar uefi lxqt con-red
          # Con una wifi Broadcom simulada: broadcom-wl se compila con lo
          # que se descarga (la Ligera no trae el compilador).
          - instalar bios mate con-red broadcom
          - instalar bios ninguno sin-red
          # Escritorios livianos que vienen completos en la ISO.
          - instalar uefi mate sin-red
          - instalar bios lxqt sin-red
          - instalar bios xfce-wayland sin-red
    steps:
      - uses: actions/checkout@v5

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf xorriso socat imagemagick

      - uses: actions/download-artifact@v7
        with:
          name: iso-${{ matrix.alpine }}
          path: iso

      - name: Probar
        run: |
          set -- ${{ matrix.prueba }}
          orden="$1"; shift
          ./pruebas/qemu.sh "$orden" iso/*.iso "$@"

      - name: Nombre de los resultados
        if: always()
        id: nombre
        run: echo "valor=$(echo '${{ matrix.prueba }}-${{ matrix.alpine }}' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: resultados-${{ steps.nombre.outputs.valor }}
          path: |
            pruebas/resultados/*.log
            pruebas/resultados/*.png
            pruebas/resultados/*.ppm
          retention-days: 14

  # Un solo resultado para la regla que protege main: queda en verde solo
  # si todo lo demás pasó (lo de edge no cuenta: sus fallas solo avisan).
  todo-en-verde:
    name: Todo en verde
    if: always()
    needs: [manual, iso, pruebas, graficas, iso-completa, pruebas-completa]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Revisar los resultados
        run: |
          echo '${{ toJSON(needs) }}'
          case '${{ join(needs.*.result, ' ') }}' in
            *failure* | *cancelled*)
              echo "::error::Alguna compilación o prueba falló."
              exit 1
              ;;
          esac

  # Deja la ISO estable, ya probada, en una Release pública "en-desarrollo"
  # (prerelease): descarga directa del .iso, sin iniciar sesión en GitHub
  # y reanudable, a diferencia de los Artifacts.
  publicar:
    name: Publicar ISO en desarrollo
    needs: [pruebas, graficas]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: lazaro-publicar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v7
        with:
          name: iso-estable
          path: iso

      # El manual también se descarga suelto, junto a la ISO.
      - uses: actions/download-artifact@v7
        with:
          name: manual
          path: manual

      - name: Manual junto a la ISO
        run: |
          . ./config.env
          cp manual/lazaro-manual.pdf "iso/$ISO_NAME-$ISO_VERSION-manual.pdf"

      - name: Actualizar la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          etiqueta=en-desarrollo
          notas="ISO de prueba compilada desde main ($GITHUB_SHA) y verificada en QEMU (BIOS y UEFI). No es una versión final: pruébala solo en una máquina virtual o en un equipo de sobra.

          Esta es la edición Ligera. La edición Completa (unos 4,5 GB, se instala sin internet con cualquiera de los 7 escritorios) está en SourceForge: https://sourceforge.net/projects/$SF_PROYECTO/files/Completa/"
          if gh release view "$etiqueta" >/dev/null 2>&1; then
            gh release edit "$etiqueta" --prerelease --notes "$notas"
          else
            gh release create "$etiqueta" --prerelease --target "$GITHUB_SHA" \
              --title "Lázaro Linux (en desarrollo)" --notes "$notas"
          fi
          # La etiqueta sigue al último commit probado.
          git_ref="refs/tags/$etiqueta"
          gh api -X PATCH "repos/$GH_REPO/git/$git_ref" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload "$etiqueta" iso/* --clobber

      # Copia en SourceForge (carpeta Ligera). Si falla, la Release de
      # GitHub ya quedó publicada: solo se avisa.
      - name: Subir a SourceForge
        continue-on-error: true
        env:
          SF_LLAVE: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: sh .github/subir-sourceforge.sh Ligera iso

  # La Completa no cabe en una Release de GitHub (2 GB por archivo): se
  # publica solo en SourceForge, carpeta Completa.
  publicar-completa:
    name: Publicar ISO Completa en SourceForge
    needs: [pruebas-completa, graficas]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: lazaro-publicar-completa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Liberar espacio en disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/download-artifact@v7
        with:
          name: iso-completa
          path: iso

      - name: Subir a SourceForge
        env:
          SF_LLAVE: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: sh .github/subir-sourceforge.sh Completa iso

  # Versión numerada (etiqueta vX.Y): se publica solo si las DOS ediciones
  # pasaron sus pruebas, en su propia Release (fija: nunca se reemplaza) y
  # en SourceForge, carpeta Versiones/X.Y. Grupo propio: una publicación
  # de main nunca desplaza a la de una versión.
  publicar-version:
    name: Publicar la versión
    needs: [pruebas, graficas, pruebas-completa]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: lazaro-publicar-version-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      # Solo se publica un commit que ya está en main (protegida): una
      # etiqueta puesta en otro lado no se publica.
      - name: Revisar que la etiqueta esté en main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          estado="$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)"
          echo "Commit $GITHUB_SHA respecto de main: $estado"
          case "$estado" in
            identical | behind) ;;
            *)
              echo "::error::La etiqueta $GITHUB_REF_NAME apunta a un commit que no está en main: no se publica."
              exit 1
              ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::La versión $GITHUB_REF_NAME ya está publicada y una versión no se reemplaza. Para corregirla, saca la siguiente."
            exit 1
          fi

      - name: Liberar espacio en disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/download-artifact@v7
        with:
          name: iso-estable
          path: iso

      - uses: actions/download-artifact@v7
        with:
          name: iso-completa
          path: iso-completa

      - uses: actions/download-artifact@v7
        with:
          name: manual
          path: manual

      - name: Manual junto a la ISO
        run: |
          . ./config.env
          cp manual/lazaro-manual.pdf "iso/$ISO_NAME-$ISO_VERSION-manual.pdf"

      # Las dos ediciones en Versiones/X.Y. Sin reemplazar lo que ya
      # esté allí con el mismo nombre.
      - name: Subir a SourceForge
        env:
          SF_LLAVE: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SF_SIN_REEMPLAZAR: "1"
        run: |
          mkdir -p version
          cp -l iso/* iso-completa/* version/ 2>/dev/null || cp iso/* iso-completa/* version/
          sh .github/subir-sourceforge.sh "Versiones/${GITHUB_REF_NAME#v}" version

      # Versión numerada: una Release propia, fija (no se reemplaza), con
      # las novedades desde la versión anterior (los títulos de los PR).
      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          etiqueta="$GITHUB_REF_NAME"
          version="${etiqueta#v}"
          # Versión numerada anterior (la que va justo antes en orden).
          etiquetas="$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name')"
          anterior="$(printf '%s\n' "$etiquetas" "$etiqueta" | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -uV | grep -B1 -x "$etiqueta" | grep -vx "$etiqueta" || true)"
          {
            echo "Versión $version de Lázaro Linux, compilada desde el commit $GITHUB_SHA y probada en máquinas virtuales (BIOS y UEFI)."
            echo
            echo "- **Ligera** (menos de 2 GB): el archivo .iso de abajo, o en SourceForge: https://sourceforge.net/projects/$SF_PROYECTO/files/Versiones/$version/"
            echo "- **Completa** (unos 4,6 GB, se instala sin internet): solo en SourceForge, misma carpeta."
            echo
            echo "Cómo instalarla: https://github.com/$GH_REPO#guía-de-instalación-paso-a-paso"
            echo
            if [ -n "$anterior" ]; then
              echo "## Novedades desde $anterior"
              echo
              gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$etiqueta" -f previous_tag_name="$anterior" --jq .body
            else
              echo "Primera versión numerada de Lázaro Linux."
            fi
          } > notas.md
          cat notas.md
          # "Última versión" de GitHub solo si es la más alta publicada.
          mayor="$(printf '%s\n' "$etiquetas" "$etiqueta" | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -uV | tail -n 1)"
          ultima=false
          [ "$mayor" != "$etiqueta" ] || ultima=true
          gh release create "$etiqueta" --verify-tag --latest="$ultima" \
            --title "Lázaro Linux $version" --notes-file notas.md \
            version/lazaro-linux-"$version"-*
