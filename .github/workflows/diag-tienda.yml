# TEMPORAL: diagnóstico de la tienda de aplicaciones. Se borra antes de fusionar.
name: Diagnóstico tienda (temporal)
on:
  push:
    branches: [claude/project-thread-qlb7v2]
    paths: [.github/workflows/diag-tienda.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: Diagnóstico 2
        run: |
          set -x
          apk update -q
          apk add -q openrc dbus polkit gnome-software gnome-software-plugin-apk2 apk-polkit-rs glib
          apk info -e apk-polkit-rs-openrc && echo "OPENRC-SUBPAQUETE-AUTOMATICO" || echo "OPENRC-SUBPAQUETE-NO-AUTOMATICO"
          apk add -q apk-polkit-rs-openrc
          apk info -L apk-polkit-rs-openrc; cat /etc/init.d/apk-polkit* || true
          mkdir -p /run/dbus; dbus-daemon --system --fork; sleep 1
          echo "=== Sin servidor:"
          gdbus call --system --dest dev.Cogitri.apkPolkit2 --object-path /dev/Cogitri/apkPolkit2 --method dev.Cogitri.apkPolkit2.UpdateRepositories 2>&1 | head -3
          /usr/libexec/polkitd --no-debug >/tmp/polkit.log 2>&1 &
          /usr/libexec/apk-polkit/apk-polkit-server >/tmp/apkp.log 2>&1 &
          sleep 3
          gdbus introspect --system --dest dev.Cogitri.apkPolkit2 --object-path /dev/Cogitri/apkPolkit2 | grep -i method -A40 | head -40
          echo "=== Con servidor:"
          time gdbus call --system --timeout 600 --dest dev.Cogitri.apkPolkit2 --object-path /dev/Cogitri/apkPolkit2 --method dev.Cogitri.apkPolkit2.UpdateRepositories 2>&1 | head -5
          cat /tmp/apkp.log | tail -20
          find /var/lib/swcatalog -maxdepth 2 2>/dev/null
          appstreamcli status | tail -3
