# PRUEBA (rama prueba-quickshell, no se fusiona): compila Quickshell para
# Alpine 3.24 y mide Claudito Shell Fusion en Sway sin pantalla.
name: Prueba Quickshell
on:
  push:
    branches: [prueba-quickshell]
    paths:
      - paquetes/quickshell/**
      - pruebas/prueba-quickshell.sh
      - .github/workflows/prueba-quickshell.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quickshell:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/pruebas/prueba-quickshell.sh
