# Compila el kernel Lázaro (linux-lazaro) y lo publica como repositorio de
# apk firmado en la Release "kernel-<versión de Alpine>". Cada día revisa
# si Alpine sacó un linux-lts nuevo (casi siempre, arreglos de seguridad):
# solo entonces compila, prueba el arranque en QEMU y publica. Los equipos
# con el kernel Lázaro lo descargan con lazaro-kernel (tarea diaria) y lo
# instalan con la actualización normal del sistema.
name: Kernel Lázaro

on:
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "pruebas/kernel-arranque.sh"
      - ".github/workflows/lazaro-kernel.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "pruebas/kernel-arranque.sh"
      - ".github/workflows/lazaro-kernel.yml"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Compilar aunque ya esté publicada esta versión"
        type: boolean
        default: false

concurrency:
  group: lazaro-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    name: ¿Hay un kernel nuevo?
    runs-on: ubuntu-24.04
    outputs:
      compilar: ${{ steps.r.outputs.compilar }}
      version: ${{ steps.r.outputs.version }}
      etiqueta: ${{ steps.r.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@v5
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          LAZARO_DIR=$PWD . ./lib.sh
          . kernel/version
          apkbuild="$(curl -fsSL --retry 3 "https://raw.githubusercontent.com/alpinelinux/aports/$APORTS_BRANCH/main/linux-lts/APKBUILD")"
          pkgver="$(printf '%s\n' "$apkbuild" | sed -n 's/^pkgver=//p')"
          pkgrel="$(printf '%s\n' "$apkbuild" | sed -n 's/^pkgrel=//p')"
          version="$pkgver-r$((pkgrel * 100 + KERNEL_REV))"
          etiqueta="kernel-$ALPINE_BRANCH"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "etiqueta=$etiqueta" >> "$GITHUB_OUTPUT"
          compilar=si
          if [ "${{ github.event_name }}" = schedule ] || { [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.forzar }}" != true ]; }; then
            if gh release view "$etiqueta" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "linux-lazaro-$version.apk"; then
              compilar=no
            fi
          fi
          echo "compilar=$compilar" >> "$GITHUB_OUTPUT"
          echo "linux-lazaro $version ($etiqueta): compilar=$compilar"

  compilar:
    name: Compilar y probar linux-lazaro ${{ needs.revisar.outputs.version }}
    needs: revisar
    if: needs.revisar.outputs.compilar == 'si' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Compilar
        env:
          LAZARO_APK_KEY: ${{ secrets.LAZARO_APK_KEY }}
        run: ./kernel/compilar.sh

      - name: Probar el arranque en QEMU (y comparar con linux-lts)
        shell: bash
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 cpio >/dev/null
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          LAZARO_DIR=$PWD . ./lib.sh
          lts_ver="$(curl -fsSL "$ALPINE_REPO_MAIN/$ALPINE_ARCH/APKINDEX.tar.gz" | tar -xzO APKINDEX | awk '/^P:linux-lts$/ { p = 1 } p && /^V:/ { print substr($0, 3); exit }')"
          curl -fsSL --retry 3 -o /tmp/linux-lts.apk "$ALPINE_REPO_MAIN/$ALPINE_ARCH/linux-lts-$lts_ver.apk" || true
          sh pruebas/kernel-arranque.sh "salida/kernel/x86_64/linux-lazaro-${{ needs.revisar.outputs.version }}.apk" /tmp/linux-lts.apk | tee /tmp/arranque.txt
          sudo sh -c 'cat /tmp/arranque.txt >> salida/kernel/resumen.txt'
          {
            echo "### Kernel Lázaro ${{ needs.revisar.outputs.version }}"
            echo '```'
            cat salida/kernel/resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: kernel-lazaro
          path: salida/kernel
          retention-days: 14

  publicar:
    name: Publicar linux-lazaro ${{ needs.revisar.outputs.version }}
    needs: [revisar, compilar]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: lazaro-kernel-publicar
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: kernel-lazaro
          path: kernel

      - name: Actualizar la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ETIQUETA: ${{ needs.revisar.outputs.etiqueta }}
        run: |
          # Solo se publica lo firmado con la clave oficial.
          grep -qx 'FIRMA=oficial' kernel/resumen.txt || { echo "Sin el secreto LAZARO_APK_KEY no se publica."; exit 1; }
          notas="Kernel Lázaro (linux-lazaro) para Lázaro Linux con Alpine ${ETIQUETA#kernel-}: el linux-lts de Alpine sin hardware de servidores ni información de depuración y con expropiación completa. Se instala desde el menú Afinador o con: doas lazaro-kernel --instalar. No hace falta descargar nada a mano.

          $(cat kernel/resumen.txt)"
          if gh release view "$ETIQUETA" >/dev/null 2>&1; then
            gh release edit "$ETIQUETA" --notes "$notas"
          else
            gh release create "$ETIQUETA" --target "$GITHUB_SHA" --latest=false \
              --title "Kernel Lázaro (Alpine ${ETIQUETA#kernel-})" --notes "$notas"
          fi
          # Primero los paquetes y al final el índice, para que un equipo
          # que descarga a la mitad nunca vea un índice sin sus paquetes.
          gh release upload "$ETIQUETA" kernel/x86_64/*.apk kernel/lazaro-kernel.rsa.pub --clobber
          gh release upload "$ETIQUETA" kernel/x86_64/APKINDEX.tar.gz --clobber
          # Los paquetes de versiones anteriores ya no los nombra el índice.
          nuevos="$(cd kernel/x86_64 && ls ./*.apk | sed 's|^\./||')"
          gh release view "$ETIQUETA" --json assets -q '.assets[].name' | grep '\.apk$' | while read -r a; do
            printf '%s\n' "$nuevos" | grep -qx "$a" || gh release delete-asset "$ETIQUETA" "$a" -y
          done
