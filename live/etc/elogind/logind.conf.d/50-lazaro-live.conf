# Sesión live de Lázaro Linux: no suspender durante la instalación, ni
# por inactividad ni al cerrar la tapa de un portátil. Solo afecta a la
# sesión live: el sistema instalado no lleva este archivo.
[Login]
IdleAction=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
