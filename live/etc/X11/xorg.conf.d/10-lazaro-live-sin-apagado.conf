# Sesión live de Lázaro Linux: la pantalla no se apaga sola. La
# instalación puede tardar horas en un equipo lento; con la pantalla
# apagada parecía colgada y, con algunas tarjetas (nouveau), no volvía.
# Solo afecta a la sesión live: el sistema instalado no lleva este archivo.
Section "ServerFlags"
	Option "BlankTime"   "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime"     "0"
EndSection

Section "Extensions"
	Option "DPMS" "Disable"
EndSection
