# Sesión live: entra directo al escritorio con el usuario "lazaro".

# Sin esto, LightDM espera a que elogind diga que el puesto (seat0)
# puede mostrar gráficos, y elogind solo lo dice si hay un dispositivo
# de pantalla del kernel (DRM o framebuffer). Con una NVIDIA antigua en
# modo seguro, arrancando en BIOS, no hay ninguno: LightDM esperaba para
# siempre y quedaba el inicio de sesión en texto. Xorg se las arregla
# igual con el controlador VESA.
[LightDM]
logind-check-graphical=false

[Seat:*]
autologin-user=lazaro
autologin-user-timeout=0
autologin-session=xfce
