# Sesión live: el usuario "lazaro" abre el instalador (como root) sin
# contraseña. No se usa keepenv: Calamares recibe solo lo que necesita
# para mostrar su ventana y su idioma, nunca rutas de módulos de Qt
# puestas por el usuario.
permit nopass setenv { DISPLAY XAUTHORITY LANG LC_ALL QT_QPA_PLATFORM=xcb } lazaro as root cmd /usr/bin/calamares
