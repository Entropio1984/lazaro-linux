# Sesión live: el usuario "lazaro" es administrador sin contraseña, como
# en otras ISO live (root está bloqueado; "doas -s" abre una terminal de
# root). Nada de esto pasa al sistema instalado: allí lazaro-instalar
# escribe su propio /etc/doas.d.
# setenv: sin LANG, lo que se abre con doas (btop, por ejemplo) no ve
# el UTF-8 ni el idioma.
permit nopass setenv { LANG LC_ALL } lazaro as root
# Calamares (regla aparte, al final porque en doas gana la última que
# coincide): no se usa keepenv, recibe solo lo que necesita para mostrar
# su ventana y su idioma, nunca rutas de módulos de Qt puestas por el
# usuario.
permit nopass setenv { DISPLAY XAUTHORITY LANG LC_ALL QT_QPA_PLATFORM=xcb } lazaro as root cmd /usr/bin/calamares
