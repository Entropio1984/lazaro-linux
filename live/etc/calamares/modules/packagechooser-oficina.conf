# Programas de oficina que instala desktop-postinstall.sh (se traducen a
# sus variables OPT_* en lazaro-instalar). Por defecto ninguno, para que
# la instalación mínima sea ligera. El valor elegido queda en Global
# Storage como packagechooser_oficina.
---
mode: required
method: legacy
labels:
    step: "Office"
    step[es]: "Oficina"
default: ninguna
items:
    - id: ninguna
      name: "No office suite (recommended)"
      name[es]: "Sin programas de oficina (recomendado)"
      description: "Lighter installation. You can install an office suite later."
      description[es]: "Instalación más ligera. Puedes instalar una suite de oficina más adelante."
    - id: libreoffice
      name: "LibreOffice"
      name[es]: "LibreOffice"
      description: "Documents, spreadsheets and presentations, in Spanish. Large download. Needs internet."
      description[es]: "Documentos, hojas de cálculo y presentaciones, en español. Descarga grande. Necesita internet."
    - id: onlyoffice
      name: "OnlyOffice"
      name[es]: "OnlyOffice"
      description: "Looks and works like Microsoft Office. Installed from Flathub, so Flatpak is installed too. Needs internet and more disk space."
      description[es]: "Se parece a Microsoft Office y abre bien sus documentos. Viene de Flathub, así que también se instala Flatpak. Necesita internet y más espacio."
