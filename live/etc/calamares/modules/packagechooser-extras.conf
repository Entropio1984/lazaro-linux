# Aplicaciones adicionales que instala desktop-postinstall.sh (se
# traducen a sus variables OPT_* en lazaro-instalar). Una sola opción por
# paquete de programas: la selección múltiple de packagechooser pide
# Ctrl+clic, poco claro para quien no conoce el truco. El valor elegido
# queda en Global Storage como packagechooser_extras.
---
mode: required
method: legacy
labels:
    step: "Applications"
    step[es]: "Aplicaciones"
default: flatpak
items:
    - id: flatpak
      name: "Essentials + Flathub app store (recommended)"
      name[es]: "Lo esencial + tienda Flathub (recomendado)"
      description: "Firefox, printer support and Flatpak, so the app store can install thousands of apps from Flathub. Flatpak itself takes little space; apps take more as you install them."
      description[es]: "Firefox, impresoras y Flatpak, para que la tienda de aplicaciones pueda instalar miles de programas desde Flathub. Flatpak ocupa poco; cada programa que instales ocupa más."
    - id: esencial
      name: "Essentials only"
      name[es]: "Solo lo esencial"
      description: "Firefox and printer support. The app store only shows Alpine packages. Flatpak can be added later."
      description[es]: "Firefox e impresoras. La tienda de aplicaciones solo muestra los programas de Alpine. Flatpak se puede agregar después."
    - id: flatpak-chrome
      name: "Essentials + Flathub + Chrome"
      name[es]: "Lo esencial + Flathub + Chrome"
      description: "Also installs Google Chrome from Flathub (community package, not official from Google). Needs more disk space."
      description[es]: "Además, Google Chrome desde Flathub (paquete comunitario, no oficial de Google). Necesita bastante más espacio."
