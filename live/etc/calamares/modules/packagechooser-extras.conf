# Aplicaciones adicionales que instala desktop-postinstall.sh (se
# traducen a sus variables OPT_* en lazaro-instalar). Una sola opción por
# paquete de programas: la selección múltiple de packagechooser pide
# Ctrl+clic, poco claro para quien no conoce el truco. El valor elegido
# queda en Global Storage como packagechooser_extras.
---
mode: required
method: legacy
labels:
    step: "Applications"
    step[es]: "Aplicaciones"
default: esencial
items:
    - id: esencial
      name: "Essentials (recommended)"
      name[es]: "Lo esencial (recomendado)"
      description: "Firefox and printer support."
      description[es]: "Firefox e impresoras."
    - id: flatpak
      name: "Essentials + Flatpak"
      name[es]: "Lo esencial + Flatpak"
      description: "Adds Flatpak with the Flathub store, to install more apps later. Needs internet."
      description[es]: "Además, Flatpak con la tienda Flathub, para instalar más aplicaciones después. Ocupa más disco. Necesita internet."
    - id: flatpak-chrome
      name: "Essentials + Flatpak + Chrome"
      name[es]: "Lo esencial + Flatpak + Chrome"
      description: "Also installs Google Chrome from Flathub (community package, not official from Google). Needs internet and more disk space."
      description[es]: "Además, Google Chrome desde Flathub (paquete comunitario, no oficial de Google). Necesita internet y bastante más espacio."
