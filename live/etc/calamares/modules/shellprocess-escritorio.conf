# Escritorio elegido, con setup-desktop de Alpine.
---
dontChroot: true
# 3 horas, como el paso de ajustes: con un wifi lento, GNOME o Plasma en la
# Ligera (que se descargan) pueden pasar de 90 minutos. Una descarga que se
# queda colgada no espera hasta aquí: lazaro-instalar la corta a los 3
# minutos sin avanzar y la reintenta (en_destino_vigilado).
timeout: 10800
verbose: true
script:
    - "/usr/sbin/lazaro-instalar escritorio ${ROOT} '${gs[packagechooser_escritorio]}'"
i18n:
    name: "Instalando el escritorio"
