---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    # GNOME y Plasma piden más; XFCE cabe holgado en 10 GB.
    requiredStorage: 10
    requiredRam: 1.0
    # Sin "internet": Calamares lo revisa una sola vez, al abrir, y no lo
    # vuelve a revisar (solo repite la revisión mientras falte algo
    # obligatorio). Si el wifi se conectaba después, seguía diciendo "no
    # está conectado a Internet" hasta el final. Internet no es
    # obligatorio (los escritorios livianos vienen en el USB) y
    # lazaro-instalar revisa la conexión en el momento de instalar.
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram
        - root

geoip:
    style: "none"
