# Idioma, teclado, zona horaria y desktop-postinstall.sh.
---
dontChroot: true
timeout: 5400
verbose: true
script:
    - "/usr/sbin/lazaro-instalar ajustes ${ROOT} '${USER}' '${gs[localeConf.LANG]}' '${gs[keyboardLayout]}' '${gs[keyboardVariant]}' '${gs[locationRegion]}/${gs[locationZone]}' '${gs[packagechooser_extras]}'"
i18n:
    name: "Configurando el sistema"
