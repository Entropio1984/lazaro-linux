# Idioma, teclado, zona horaria y desktop-postinstall.sh.
---
dontChroot: true
# 3 horas: con un wifi lento, Plasma o GNOME (que se descargan) más el
# idioma y los programas pueden pasar de los 90 minutos de antes; si se
# corta aquí, falla la instalación entera. Las apps de Flathub ya no se
# descargan en este paso (quedan para el primer arranque).
timeout: 10800
verbose: true
script:
    - "/usr/sbin/lazaro-instalar ajustes ${ROOT} '${USER}' '${gs[localeConf.LANG]}' '${gs[keyboardLayout]}' '${gs[keyboardVariant]}' '${gs[locationRegion]}/${gs[locationZone]}' '${gs[lazaroExtras]}'"
i18n:
    name: "Configurando el sistema"
