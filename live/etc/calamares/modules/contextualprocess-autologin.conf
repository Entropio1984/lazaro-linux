# Inicio de sesión automático: el módulo users deja autoLoginUser en
# Global Storage solo si se marcó la casilla ("*" = cualquier usuario).
# Si no se marcó, la variable no existe y no se ejecuta nada.
---
dontChroot: true
timeout: 120
autoLoginUser:
    "*": "/usr/sbin/lazaro-instalar autologin ${ROOT} '${gs[autoLoginUser]}'"
