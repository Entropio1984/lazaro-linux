# Pantalla "Software adicional": casillas con los programas que se pueden
# agregar. Los nombres de "packages" no son paquetes de Alpine sino marcas
# propias: el módulo lazaroextras las anota y lazaro-instalar las traduce
# a paquetes de Alpine. Firefox e impresoras se instalan siempre y no
# aparecen aquí. Flatpak y las aplicaciones de Flathub (OnlyOffice,
# Chrome, Brave) ya no se ofrecen aquí: alargaban la instalación y se
# activan después desde la Bienvenida (lazaro-flatpak). La edición
# Completa agrega OnlyOffice y Brave, que vienen en el USB
# (perfil/genapkovl-lazaro.sh).
---
groupsUrl: local
required: false
label:
    sidebar: "Additional software"
    sidebar[es]: "Software adicional"
    title: "Choose the extra programs to install. Firefox is always installed."
    title[es]: "Elige los programas adicionales. Firefox se instala siempre."
groups:
    - name: "Programas de Alpine"
      description: "Vienen en el USB: se instalan junto con el sistema, sin necesidad de internet."
      expanded: true
      noncheckable: true
      selected: false
      subgroups:
          - name: "Fastfetch"
            description: "Muestra en la terminal un resumen del equipo y del sistema."
            selected: false
            packages: [ fastfetch ]
          - name: "Btop"
            description: "Monitor de recursos en la terminal: procesador, memoria, disco y red."
            selected: false
            packages: [ btop ]
          - name: "VLC"
            description: "Reproductor de música y video que abre casi cualquier formato."
            selected: false
            packages: [ vlc ]
          - name: "YouTube ligero"
            description: "Busca y mira videos de YouTube sin abrir el navegador (Pipe Viewer y mpv, en 480p). Gasta mucho menos que YouTube en Firefox."
            selected: true
            packages: [ youtube ]
          - name: "LibreOffice"
            description: "Documentos, hojas de cálculo y presentaciones, en el idioma elegido. Viene en el USB (en español; otro idioma se descarga)."
            selected: false
            packages: [ libreoffice ]
