# Pantalla "Software adicional": casillas con los programas que se pueden
# agregar. Los nombres de "packages" no son paquetes de Alpine sino marcas
# propias: el módulo lazaroextras las anota y lazaro-instalar las traduce
# (paquetes de Alpine o aplicaciones de Flathub). Firefox e impresoras se
# instalan siempre y no aparecen aquí.
---
groupsUrl: local
required: false
label:
    sidebar: "Additional software"
    sidebar[es]: "Software adicional"
    title: "Choose the extra programs to install. Firefox is always installed."
    title[es]: "Elige los programas adicionales. Firefox se instala siempre."
groups:
    - name: "Programas de Alpine"
      description: "Se instalan junto con el sistema."
      expanded: true
      noncheckable: true
      selected: false
      subgroups:
          - name: "Fastfetch"
            description: "Muestra en la terminal un resumen del equipo y del sistema."
            selected: false
            packages: [ fastfetch ]
          - name: "Btop"
            description: "Monitor de recursos en la terminal: procesador, memoria, disco y red."
            selected: false
            packages: [ btop ]
          - name: "VLC"
            description: "Reproductor de música y video que abre casi cualquier formato."
            selected: false
            packages: [ vlc ]
          - name: "LibreOffice"
            description: "Documentos, hojas de cálculo y presentaciones, en el idioma elegido. Descarga grande."
            selected: false
            packages: [ libreoffice ]
    - name: "Aplicaciones Flatpak (se instalan solas después del primer arranque, con internet)"
      description: "Vienen de Flathub. Se descargan en segundo plano unos minutos después de encender el equipo conectado a internet."
      expanded: true
      noncheckable: true
      selected: false
      subgroups:
          - name: "Flatpak + tienda Flathub (recomendado)"
            description: "La tienda de aplicaciones podrá instalar miles de programas de Flathub. Ocupa poco."
            selected: true
            packages: [ flatpak ]
          - name: "OnlyOffice"
            description: "Se parece a Microsoft Office y abre bien sus documentos. Necesita bastante espacio."
            selected: false
            packages: [ onlyoffice ]
          - name: "Google Chrome"
            description: "Navegador de Google (paquete comunitario de Flathub, no oficial de Google)."
            selected: false
            packages: [ chrome ]
          - name: "Brave"
            description: "Navegador centrado en la privacidad, con bloqueo de anuncios."
            selected: false
            packages: [ brave ]
