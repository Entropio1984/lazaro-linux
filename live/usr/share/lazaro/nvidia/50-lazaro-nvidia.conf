# Lázaro Linux con NVIDIA: LightDM arranca el Xorg del sysroot glibc, que
# carga el controlador de NVIDIA (docs/nvidia/ARQUITECTURA.md, 4.3). El
# escritorio sigue siendo el de Lázaro (musl), como cliente de ese Xorg.
[Seat:*]
xserver-command=/usr/libexec/lazaro/nvidia-raiz xorg
# Cuando Xorg ya está listo: avisa a lazaro-nvidia.initd que no hace falta
# volver a nouveau.
display-setup-script=/usr/libexec/lazaro/nvidia-raiz listo
