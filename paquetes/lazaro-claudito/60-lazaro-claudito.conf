# Lázaro Linux (paquete lazaro-claudito): la barra de Sway es Claudito
# Shell Fusion (https://gitlab.com/linux-en-casa/claudito-shell-fusion),
# hecha con Quickshell. Este archivo va después de 50-lazaro-barra.conf
# (la barra waybar de desktop-postinstall.sh) y la reemplaza.

# La barra de Sway (bar-0) ya no arranca waybar: la dibuja Claudito.
bar bar-0 mode invisible
bar bar-0 swaybar_command true

exec dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK
for_window [title="^Selector de fondo$"] floating enable, resize set 900 540, move position center
# Al entrar y cada vez que se recarga Sway (Super+Mayús+C).
exec_always lazaro-claudito

# Atajos de Claudito Shell (los mismos de su sway-config-snippet.conf).
# Las líneas "# @category" y "# @title" son para la ventana de atajos de
# Claudito (Super+Alt+K): con ellas muestra solo esta lista, en español,
# en lugar de cada línea de la configuración de Sway. Los atajos básicos
# de Sway se repiten aquí (iguales a los de /etc/sway/config) solo para
# que salgan en esa lista.
# @category Programas
# @title Abrir el menú de programas
bindsym --no-warn $mod+d exec qs -c sway-bar ipc call launcher toggle
bindsym --no-warn $mod+alt+d exec qs -c sway-bar ipc call launcher toggle
# @title Abrir una terminal
bindsym --no-warn $mod+Return exec $term
# @category Ventanas
# @title Cerrar la ventana
bindsym --no-warn $mod+Shift+q kill
# @title Pantalla completa
bindsym --no-warn $mod+f fullscreen
# @title Ventana flotante o acomodada
bindsym --no-warn $mod+Shift+space floating toggle
# @title Lista de ventanas abiertas
bindsym --no-warn $mod+alt+Tab exec qs -c sway-bar ipc call windowlist toggle
# @title Ir al escritorio 1
bindsym --no-warn $mod+1 workspace number 1
# @title Ir al escritorio 2
bindsym --no-warn $mod+2 workspace number 2
# @title Llevar la ventana al escritorio 2
bindsym --no-warn $mod+Shift+2 move container to workspace number 2
# @category Escritorio
# @title Cambiar el fondo de pantalla
bindsym --no-warn $mod+alt+w exec qs -c sway-bar ipc call wallpaper toggle
# @title Modo claro u oscuro
bindsym --no-warn $mod+alt+t exec qs -c sway-bar ipc call theme toggle
# @title Ver estos atajos
bindsym --no-warn $mod+alt+k exec qs -c sway-bar ipc call keybinds toggle
# @title Ajustes de Claudito
bindsym --no-warn $mod+alt+c exec qs -c sway-bar ipc call config-dock toggle
# @title Ajustes de la barra
bindsym --no-warn $mod+alt+comma exec qs -c sway-bar ipc call bar-config toggle
# @title Esconder o mostrar la barra
bindsym --no-warn $mod+alt+b exec qs -c sway-bar ipc call autohide toggle
# @title Recargar Sway
bindsym --no-warn $mod+Shift+c reload
# @title Apagar, reiniciar o cerrar sesión
bindsym --no-warn $mod+shift+x exec qs -c sway-bar ipc call powermenu toggle

# Teclas de volumen (Claudito lee el volumen de PipeWire).
bindsym --no-warn XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --no-warn XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --no-warn XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --no-warn XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
