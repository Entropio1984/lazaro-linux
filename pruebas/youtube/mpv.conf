# mpv de Lázaro Linux, pensado para un núcleo y 2 GB de RAM.
ytdl-format=bestvideo[height<=?480][vcodec^=avc1][fps<=30]+bestaudio[acodec^=mp4a]/bestvideo[height<=?480][vcodec^=avc1]+bestaudio/best[height<=?480][vcodec^=avc1]/best[height<=?480]/best
hwdec=auto-safe
cache=yes
demuxer-max-bytes=50MiB
demuxer-max-back-bytes=10MiB
